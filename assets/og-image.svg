<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left: Profile and Value Prop -->
  <g transform="translate(80, 100)">
    <rect width="80" height="80" rx="20" fill="url(#blueGrad)"/>
    <text x="40" y="52" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle">NQM</text>
    
    <text x="0" y="140" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.02em">Nguyen Quoc Minh</text>
    <text x="0" y="185" fill="#60A5FA" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Business Process Automation Engineer</text>
    <text x="0" y="225" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400">Finance-oriented Automation · Systems Integration · Data Engineering</text>

    <!-- Tagline Box -->
    <rect x="0" y="270" width="560" height="95" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="310" fill="#E2E8F0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">"Transforming manual business and financial workflows</text>
    <text x="24" y="340" fill="#38BDF8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">into reliable, measurable, and maintainable automated systems."</text>
  </g>

  <!-- Right: 3 Headline KPI Cards -->
  <g transform="translate(720, 100)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="400" height="115" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(37,99,235,0.3)" stroke-width="1.5"/>
    <text x="28" y="42" fill="#60A5FA" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">160+ hrs/mo</text>
    <text x="28" y="72" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Manual Labor Eliminated</text>
    <text x="28" y="94" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="13">End-to-end invoice OCR and reporting pipelines</text>

    <!-- Card 2 -->
    <rect x="0" y="135" width="400" height="115" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(34,197,94,0.3)" stroke-width="1.5"/>
    <text x="28" y="177" fill="#4ADE80" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">99.8% Accuracy</text>
    <text x="28" y="207" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Data Extraction and Reconciliation</text>
    <text x="28" y="229" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="13">Multi-engine fallback + dual-source validation</text>

    <!-- Card 3 -->
    <rect x="0" y="270" width="400" height="115" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
    <text x="28" y="312" fill="#C084FC" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">Idempotent</text>
    <text x="28" y="342" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Audit-Ready Architecture</text>
    <text x="28" y="364" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="13">Self-healing OAuth, structured audit logs and alerts</text>
  </g>

  <!-- Bottom Strip: Tech Stack Badges -->
  <g transform="translate(80, 520)">
    <rect x="0" y="0" width="1040" height="65" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="28" y="38" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="0.05em">CORE SYSTEMS:</text>
    
    <g transform="translate(180, 16)">
      <rect x="0" y="0" width="110" height="32" rx="6" fill="rgba(37,99,235,0.2)" stroke="rgba(37,99,235,0.4)"/>
      <text x="55" y="21" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Python · ETL</text>
      
      <rect x="125" y="0" width="125" height="32" rx="6" fill="rgba(34,197,94,0.2)" stroke="rgba(34,197,94,0.4)"/>
      <text x="187" y="21" fill="#86EFAC" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">OCR &amp; Vision</text>
      
      <rect x="265" y="0" width="120" height="32" rx="6" fill="rgba(245,158,11,0.2)" stroke="rgba(245,158,11,0.4)"/>
      <text x="325" y="21" fill="#FDE047" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">PostgreSQL</text>
      
      <rect x="400" y="0" width="140" height="32" rx="6" fill="rgba(56,189,248,0.2)" stroke="rgba(56,189,248,0.4)"/>
      <text x="470" y="21" fill="#BAE6FD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">REST &amp; Webhooks</text>
      
      <rect x="555" y="0" width="130" height="32" rx="6" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.4)"/>
      <text x="620" y="21" fill="#E9D5FF" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">FastAPI · Node</text>

      <rect x="700" y="0" width="140" height="32" rx="6" fill="rgba(236,72,153,0.2)" stroke="rgba(236,72,153,0.4)"/>
      <text x="770" y="21" fill="#FBCFE8" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Docker &amp; Cloud</text>
    </g>
  </g>
</svg>